name: Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,  goos: windows, goarch: amd64, artifact: super-liquid-soccer-windows-x64.exe }
          - { name: linux-amd64,  goos: linux,   goarch: amd64, artifact: super-liquid-soccer-linux-amd64     }
          - { name: macos-arm64,  goos: darwin,  goarch: arm64, artifact: super-liquid-soccer-macos-arm64     }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -trimpath -o "${{ matrix.artifact }}" .

      - uses: actions/upload-artifact@v4
        with:
          name:           ${{ matrix.artifact }}
          path:           ${{ matrix.artifact }}
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject coi-serviceworker
        run: |
          curl -fsSL -o game/coi-serviceworker.js \
            https://cdn.jsdelivr.net/gh/gzuidhof/coi-serviceworker@v0.1.7/coi-serviceworker.min.js

          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("game/index.html")
          html = p.read_text()
          patched = html.replace(
              "<head>",
              '<head>\n\t<script src="coi-serviceworker.js"></script>',
              1,
          )
          p.write_text(patched)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            super-liquid-soccer-windows-x64.exe
            super-liquid-soccer-linux-amd64
            super-liquid-soccer-macos-arm64
