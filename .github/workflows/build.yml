name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name:     windows-x64
            goos:     windows
            goarch:   amd64
            artifact: super-liquid-soccer-windows-x64.exe

          - name:     linux-amd64
            goos:     linux
            goarch:   amd64
            artifact: super-liquid-soccer-linux-amd64

          - name:     macos-arm64
            goos:     darwin
            goarch:   arm64
            artifact: super-liquid-soccer-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build ${{ matrix.name }}
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w" \
            -trimpath \
            -o "${{ matrix.artifact }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name:            ${{ matrix.artifact }}
          path:            ${{ matrix.artifact }}
          retention-days:  7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft:                  false
          prerelease:             false
          generate_release_notes: true
          files: |
            super-liquid-soccer-windows-x64.exe
            super-liquid-soccer-linux-amd64
            super-liquid-soccer-macos-arm64
